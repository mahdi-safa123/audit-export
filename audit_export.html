<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>تصدير سجل التدقيق</title>
  <style>
    table, th, td {
      border: 1px solid #333;
      border-collapse: collapse;
      padding: 8px;
    }
  </style>
</head>
<body>
  <h2>سجل التدقيق</h2>
  <table id="auditLogTable">
    <thead>
      <tr>
        <th>التاريخ</th>
        <th>المستخدم</th>
        <th>الإجراء</th>
      </tr>
    </thead>
    <tbody>
      <tr><td>2025-06-30 10:15</td><td>Ali</td><td>تسجيل دخول</td></tr>
      <tr><td>2025-06-30 10:20</td><td>سارة</td><td>تعديل بيانات</td></tr>
      <!-- أضف المزيد من الصفوف حسب الحاجة -->
    </tbody>
  </table>

  <div style="text-align: center; margin-top: 15px;">
    <button onclick="printAuditOnly()">🖨️ طباعة سجل التدقيق فقط</button>
    <button onclick="exportAuditLog()">💾 حفظ سجل التدقيق</button>
  </div>

  <script>
    function printAuditOnly() {
      const originalBody = document.body.innerHTML;
      const auditTable = document.getElementById("auditLogTable").outerHTML;
      document.body.innerHTML = auditTable;
      window.print();
      document.body.innerHTML = originalBody;
    }

    function exportAuditLog() {
      const table = document.getElementById("auditLogTable");
      let csvContent = "";

      for (let row of table.rows) {
        let rowData = Array.from(row.cells)
          .map(cell => `"${cell.textContent.trim()}"`)
          .join(",");
        csvContent += rowData + "\n";
      }

      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "سجل_التدقيق.csv";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
